name: release

# A pushed version tag such as v0.1.0 builds the archives and creates a
# *draft* GitHub release. After review, a maintainer publishes it either in
# the GitHub UI or by running this workflow by hand ("Run workflow") with the
# tag, which publishes the draft only if it has all seven assets.
# See docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the reviewed draft release to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: build and draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: check changelog entry
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: test
        run: go test ./...
      - name: build
        run: scripts/release-build.sh "$GITHUB_REF_NAME"
      - name: verify
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          tar -xzf "dist/p30check_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/p30check_${GITHUB_REF_NAME#v}_linux_amd64/p30check" version
          printf '\nBuilt with %s.\n' "$(go version)" >> release-notes.md
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  publish:
    name: publish reviewed draft
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft release
    steps:
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "not a version tag: $TAG" >&2; exit 1 ;;
          esac
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "$TAG is not a draft release" >&2; exit 1
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [ "$assets" -ne 7 ]; then
            echo "expected 7 assets (6 archives and SHA256SUMS), found $assets" >&2; exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json url,isDraft,publishedAt
