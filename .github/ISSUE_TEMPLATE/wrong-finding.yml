name: Wrong or missing finding
description: A finding that should not be there (false positive), or a risk the scanner missed (false negative).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the rule's "Known false positives and negatives" list in
        [docs/rules.md](https://github.com/Protocol-30/stellar-p30-check/blob/main/docs/rules.md)
        first. Do not paste private code; a minimal reproduction is enough.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - False positive (reported, but the code is fine)
        - False negative (not reported, but the code breaks on Protocol 30)
        - Wrong severity or confidence
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: P30-ADDR-001
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: p30check version
      description: Output of `p30check version`.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest file(s) that show the problem, with their paths relative to the scan root.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Scanner output
      description: The relevant part of `p30check scan <path>` (or `--format json`).
      render: text
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: What the code actually does on Protocol 30, with a source (CAP, SEP, SDK changelog) if you have one.
    validations:
      required: true
